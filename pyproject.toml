[project]
name = "conso-electrique-fr"
version = "0.1.0"
description = ""
authors = [
    {name = "bamont",email = "baptiste.montagnes@ensta-paris.fr"}
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "numpy (>=2.5.3,<3.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "pyarrow (>=25.0.1,<26.0.0)",
    "statsmodels (>=0.15.0,<0.16.0)",
    "holidays (>=0.104,<0.105)",
    "vacances-scolaires-france (>=0.12.0,<0.13.0)",
    "lightgbm (>=4.7.0,<5.0.0)",
    "shap (>=0.52.0,<0.53.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyterlab (>=4.6.3,<5.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.8,<0.17.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
notebooks = [
    "matplotlib (>=3.11.2,<4.0.0)",
    "statsmodels (>=0.15.0,<0.16.0)",
    "shap (>=0.52.0,<0.53.0)",
    "jupyterlab (>=4.6.3,<5.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)"
]

[tool.poetry]
packages = [{ include = "conso", from = "src" }]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
