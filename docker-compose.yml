# Lance l'API (port 8000) et le tableau de bord (port 8501) :   docker compose up --build
#
# Si models/prod contient un bundle entraîné avec point_model="blend" (mélange du notebook 06,
# conso.models_alt), l'API a besoin du groupe Poetry "models-alt" (scikit-learn, catboost, torch),
# pas installé par défaut (voir Dockerfile) :
#   docker compose build --build-arg MODEL_GROUPS=main,models-alt api
#   docker compose up -d

services:
  api:
    build:
      context: .
      args:
        MODEL_GROUPS: main   # "main,models-alt" si models/prod est un mélange (point_model="blend")
    image: conso-api
    ports:
      - "8000:8000"
    environment:
      CONSO_MODEL: /app/models/prod
      CONSO_DATASET: /app/data/processed/dataset_30min.parquet
      CONSO_METEO_FC: /app/data/raw/meteo_forecast_openmeteo.parquet
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro 
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: conso-dashboard
    ports:
      - "8501:8501"
    environment:
      CONSO_API_URL: http://api:8000
      CONSO_JOURNAL: /app/journal
    volumes:
      - ./data:/app/data:ro
      - ./journal:/app/journal:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped